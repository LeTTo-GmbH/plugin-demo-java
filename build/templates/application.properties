spring.application.name=plugindemo

logging.level.root=INFO

# HTTP Encoding Einstellungen
logging.level.org.springframework.boot.autoconfigure=ERROR

# Swagger Doc
springdoc.api-docs.path=/plugindemo/v3/api-docs
springdoc.swagger-ui.path=/plugindemo/swagger-ui.html
# OpenAPI 3.0, da die Swagger-UI nur dort Anker zu den Schemas hat (Links in Request body und Responses)
springdoc.api-docs.version=openapi_3_0
# Felder der Schemas mit Typ und Beschreibung sofort anzeigen (Schema-Reiter bzw. Abschnitt Schemas)
springdoc.swagger-ui.defaultModelExpandDepth=2
springdoc.swagger-ui.defaultModelsExpandDepth=2
# Tags und Endpoints alphabetisch sortieren (Schemas sortiert OpenApiConfig)
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

letto.default.dataservice=
spring.devtools.livereload.port=35731
